spring.application.name=EasyRoute_Backend

# Load environment variables from .env file
spring.config.import=optional:file:.env[.properties]

# Datasource configuration
#spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:easyroute_db}
#spring.datasource.username=${DB_USER:postgres}
#spring.datasource.password=${DB_PASSWORD:root}
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.enabled=false

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Server configuration
server.address=0.0.0.0
server.port=8080
server.error.include-message=always

# Logging configuration
logging.file.name=backend.log
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.logistics.platform=DEBUG

# App Custom JWT properties
logging.level.org.springframework.web=DEBUG
app.jwt.secret=dGhpc2lzYW5leHRyZW1lbHlzdHJvbmdzZWNyZXRrZXlmb3Jqd3R0b2tlbnNpbnRoZWxvZ2lzdGljc2FwcGxpY2F0aW9ucGxhdGZvcm1iYWNrZW5kMTIzNDU2Nzg5MA==
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=432000000

# Google Maps Configuration
google.maps.api-key=${GOOGLE_MAPS_API_KEY}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/profile-photos

# Spring AI Configuration
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=llama-3.1-8b-instant

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
